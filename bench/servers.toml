# MCPlain bench: the list of real MCP servers analyzed by bench.py.
#
# How the list was built (2026-10-29):
# 1. Reference servers of github.com/modelcontextprotocol/servers that are still published on npm or PyPI
#    (fetch, filesystem, git, memory, sequential-thinking, time, everything), plus a few archived ones that
#    are still downloaded (deprecated on npm, still installable).
# 2. Official servers of known vendors, published on npm or PyPI by the vendor itself.
# 3. The most downloaded MCP packages:
#    - npm: registry search "keywords:mcp", "mcp server", "keywords:mcp-server", sorted by popularity,
#      weekly downloads from api.npmjs.org (week ending 2026-10-28), servers only (no SDK, no client).
#    - PyPI: hugovk/top-pypi-packages, monthly dump of 2026-10-01 (30 days of downloads), servers only.
# 4. About 60 % JavaScript or TypeScript and 40 % Python.
# 5. Witnesses whose answer is known: a Go server (gray, unsupported language) and the two engine
#    references, `uvx mcp-server-fetch` and `npx -y @modelcontextprotocol/server-filesystem` (both orange).
# 6. npx or uvx entries rather than GitHub links: without a token, the GitHub API allows 60 calls per hour.
#
# Fields: id (unique), input (what a user pastes), language, group (reference, vendor, popular, witness),
# why (why it is in the list), expected (the known color, only when it is known), witness (the bench fails
# when a witness does not get its expected color).
# The bench always analyzes the latest version: no version is pinned here.

[[server]]
id = "fetch"
input = "uvx mcp-server-fetch"
language = "python"
group = "witness"
why = "Reference server; engine reference: a tool fetches any URL the AI gives (O01)"
expected = "orange"
witness = true

[[server]]
id = "filesystem"
input = "npx -y @modelcontextprotocol/server-filesystem"
language = "javascript"
group = "witness"
why = "Reference server; engine reference: writes and moves files (O08)"
expected = "orange"
witness = true

[[server]]
id = "github-go"
input = "https://github.com/github/github-mcp-server"
language = "go"
group = "witness"
why = "Official GitHub server, written in Go: the engine does not read Go"
expected = "gray"
witness = true

