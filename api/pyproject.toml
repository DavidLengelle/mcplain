[project]
name = "mcplain-api"
version = "0.1.0"
description = "HTTP API, job queue and atelier dispatcher of MCPlain"
authors = [
    { name = "David Lengelle", email = "david.lengelle.1.10@gmail.com" }
]
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "mcplain",
    "psycopg[binary]>=3.2.0,<4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.0,<3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcplain-api = "mcplain_api.server:main"
mcplain-dispatcher = "mcplain_api.dispatcher:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
mcplain = { path = "../engine", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not docker'"
markers = [
    "network: tests that reach real registries, disabled by default",
    "docker: tests that need Docker and the atelier image, disabled by default",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
