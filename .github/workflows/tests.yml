name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv run --locked pytest
      - run: ../scripts/fetch-dvmcp.sh
      - run: uv run --locked pytest tests/test_dvmcp.py tests/test_rules.py -k "dvmcp or challenge"
        env:
          MCPLAIN_REQUIRE_DVMCP: "1"

  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv run --locked pytest

  postgres-roles:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: mcplain
          POSTGRES_DB: mcplain
          POSTGRES_PASSWORD: test-only-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcplain -d mcplain"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MCPLAIN_TEST_POSTGRES_URL: postgresql+psycopg://mcplain:test-only-owner-password@127.0.0.1:5432/mcplain
      DATABASE_URL: postgresql+psycopg://mcplain:test-only-owner-password@127.0.0.1:5432/mcplain
      MCPLAIN_ALEMBIC_INI: alembic.ini
      MCPLAIN_APP_DB_PASSWORD: test-only-app-password-0123456789
      MCPLAIN_GUICHET_DB_PASSWORD: test-only-guichet-password-0123456789
      MCPLAIN_FACTEUR_DB_PASSWORD: test-only-facteur-password-0123456789
      MCPLAIN_TEST_GUICHET_DATABASE_URL: postgres://mcplain_guichet:test-only-guichet-password-0123456789@127.0.0.1:5432/mcplain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv run --locked pytest -m postgres
        working-directory: api
      - run: uv run --locked mcplain-migrate
        working-directory: api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: auth/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: auth
      - run: pnpm exec vitest run tests/schema.test.ts
        working-directory: auth

  auth:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: auth/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker build -f ../docker/auth.Dockerfile -t mcplain-guichet:ci ..

  bench:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv run --locked pytest

  atelier-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f docker/atelier.Dockerfile -t mcplain-atelier:ci .

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec playwright test
