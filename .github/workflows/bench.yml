name: bench

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.31"
      - name: Write the settings of the stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/jobs"
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "GITHUB_TOKEN=$GITHUB_TOKEN"
            echo "MCPLAIN_JOBS_DIR=$RUNNER_TEMP/jobs"
            echo "MCPLAIN_UID=$(id -u)"
            echo "MCPLAIN_GID=$(id -g)"
            echo "DOCKER_GID=$(getent group docker | cut -d: -f3)"
          } > .env
      - name: Build the images and start the stack
        run: |
          docker compose build atelier
          docker compose up -d --build --wait api dispatcher
      - name: Run the bench on the latest versions
        working-directory: bench
        run: uv run --locked python bench.py run --check --output results/bench.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the full results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/bench.json
          if-no-files-found: warn
          retention-days: 30
      - name: Show the logs of the stack
        if: failure()
        run: docker compose logs --no-color --tail 200 api dispatcher
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
