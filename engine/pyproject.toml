[project]
name = "mcplain"
version = "0.1.0"
description = "Static security scanner for MCP servers, made for beginners"
authors = [
    { name = "David Lengelle", email = "david.lengelle.1.10@gmail.com" }
]
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
mcplain = "mcplain.cli:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "-m 'not network'"
markers = [
    "network: tests that reach real registries, disabled by default",
]
